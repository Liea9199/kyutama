<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>玖球ミニゲーム集</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .game-list {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 14px;
    width: 100%; max-width: 420px;
  }
  .game-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 14px 16px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 8px 18px var(--shadow);
    transition: transform .12s, box-shadow .12s;
  }
  .game-card:hover { transform: translateY(-2px); }
  .game-card:active { transform: translateY(1px); }
  .game-card-icon { width: 56px; flex-shrink: 0; }
  .game-card-icon .mole-svg { width: 100%; height: auto; display: block; }
  .game-card-body { display: flex; flex-direction: column; gap: 2px; }
  .game-card-title { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
  .game-card-desc { font-size: .8rem; color: var(--ink-soft); font-weight: 600; }
</style>
</head>
<body>

<div class="scene">
  <div class="sky-deco" aria-hidden="true">
    <div class="orb"></div>
    <div class="stars"></div>
  </div>

  <header class="hud">
    <h1>玖球ミニゲーム集</h1>
    <p class="tagline">遊びたいミニゲームを選んでね</p>
  </header>

  <div class="game-list">
    <a class="game-card" href="games/mole.html">
      <span class="game-card-icon" id="icon-mole"></span>
      <span class="game-card-body">
        <span class="game-card-title">玖球パニック</span>
        <span class="game-card-desc">顔を出した玖球をタップして叩こう!</span>
      </span>
    </a>
    <a class="game-card" href="games/memory.html">
      <span class="game-card-icon" id="icon-memory"></span>
      <span class="game-card-body">
        <span class="game-card-title">玖球の神経衰弱</span>
        <span class="game-card-desc">同じ色の玖球のペアを見つけよう!</span>
      </span>
    </a>
    <a class="game-card" href="games/jump.html">
      <span class="game-card-icon" id="icon-jump"></span>
      <span class="game-card-body">
        <span class="game-card-title">玖球のジャンプ</span>
        <span class="game-card-desc">タップでジャンプして石を飛び越えよう!</span>
      </span>
    </a>
    <a class="game-card" href="games/lane-dodge.html">
      <span class="game-card-icon" id="icon-lane"></span>
      <span class="game-card-body">
        <span class="game-card-title">玖球のレーン避け</span>
        <span class="game-card-desc">左右に動いて迫ってくる障害物を避けよう!</span>
      </span>
    </a>
  </div>
</div>

<script src="games/mole-icon.js"></script>
<script>
  document.getElementById('icon-mole').innerHTML = moleSvgMarkup('hubMole');
  document.getElementById('icon-memory').innerHTML = moleSvgMarkup('hubMemory', '#F4A9C0');
  document.getElementById('icon-jump').innerHTML = moleSvgMarkup('hubJump', '#9BE28C');
  document.getElementById('icon-lane').innerHTML = moleSvgMarkup('hubLane', '#8EC6F1');
</script>
</body>
</html>
