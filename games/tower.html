<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ソフトクリームタワー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
  .tower-wrap { position: relative; width: 100%; max-width: 420px; }

  .tower-canvas {
    position: relative; z-index: 1;
    display: block;
    width: 100%; height: auto;
    aspect-ratio: 400 / 600;
    border-radius: 18px;
    box-shadow: 0 8px 18px var(--shadow);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="sky-deco" aria-hidden="true">
    <div class="orb"></div>
    <div class="stars"></div>
  </div>

  <a class="back-link" href="../index.html">← ミニゲーム一覧</a>

  <header class="hud">
    <h1>ソフトクリームタワー</h1>
    <p class="tagline">空から落ちてくる玖球と豹球をソフトクリームの上に積み上げよう!</p>
    <div class="stats">
      <div class="stat"><span class="stat-label">スコア</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">高さ</span><span class="stat-value" id="height">0段</span></div>
      <div class="stat"><span class="stat-label">残り</span><span class="stat-value" id="lives">♥♥♥</span></div>
      <div class="stat"><span class="stat-label">ハイスコア</span><span class="stat-value" id="highScore">0</span></div>
    </div>
  </header>

  <div class="tower-wrap">
    <canvas class="tower-canvas" id="canvas" aria-label="ソフトクリームタワーのゲーム画面"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <h2 id="overlayTitle">準備はいい?</h2>
        <p id="overlayMsg">雲に乗った玖球と豹球をタップで落として、ソフトクリームの上に積み上げよう!<br>ずれすぎるとタワーがくずれるよ。<br>まん中にぴったり置くとボーナス!</p>
        <button class="btn" id="actionBtn">スタート</button>
      </div>
    </div>
  </div>

  <p class="hint">画面タップ(またはスペースキー)で落とす。気むずかしい玖球はずれて置かれると怒ってはねるので、特にていねいに!</p>
</div>

<script src="mole-icon.js"></script>
<script>
(function () {
  'use strict';

  var HIGH_KEY = 'kyutama-tower-highscore';
  // 画面はこの論理サイズで描き、表示サイズに合わせて拡大縮小する
  var W = 400, H = 600;
  var LIVES = 3;
  var PIECE_W = 96;
  var PIECE_H = PIECE_W * 592 / 624;
  // 耳や足が重なるので、1段の高さは画像の高さより低い
  var STEP_H = PIECE_H * 0.7;
  var CONE_TOP = H - 150;
  var CREAM_TOP = CONE_TOP - 62;
  var CREAM_HALF = 58;
  var PIECE_HALF = PIECE_W * 0.42;
  var HANG_Y = 150;
  var SWING_RANGE = 130;
  var GRAVITY = 1800;
  var PERFECT_PX = 5;
  var NEXT_DELAY = 0.35;

  // 玖球は気むずかしく、ずれて置くと怒ってはねて位置がさらにずれる。豹球はおだやかでそのまま乗る
  var KINDS = {
    mole: { file: 'mole.png', fussy: true },
    leopard: { file: 'leopard.png', fussy: false }
  };

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var heightEl = document.getElementById('height');
  var livesEl = document.getElementById('lives');
  var highScoreEl = document.getElementById('highScore');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayMsg = document.getElementById('overlayMsg');
  var actionBtn = document.getElementById('actionBtn');

  var state = { playing: false, score: 0, lives: LIVES, highScore: 0, combo: 0, time: 0, swingT: 0, nextT: 0 };
  // stack の各段は { kind, x, bottom }。bottom はその段の足もとの高さ(ワールド座標、下が+)
  var stack = [];
  var hanging = null;
  var falling = null;
  var nextKind = null;
  var debris = [];
  var popups = [];
  var camY = 0;
  var rafId = null;
  var lastTs = 0;
  var audioCtx = null;
  var colors = {};

  Object.keys(KINDS).forEach(function (k) {
    var img = new Image();
    img.src = new URL(KINDS[k].file, MOLE_PNG_BASE).href;
    img.addEventListener('load', function () { if (!state.playing) render(); });
    KINDS[k].img = img;
  });

  function loadHigh() {
    try {
      var v = parseInt(localStorage.getItem(HIGH_KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }
  function saveHigh(v) {
    try { localStorage.setItem(HIGH_KEY, String(v)); } catch (e) {}
  }

  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    ['sky-top', 'sky-mid', 'ink', 'accent'].forEach(function (name) {
      colors[name] = cs.getPropertyValue('--' + name).trim();
    });
  }

  function setupCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    } else if (audioCtx.state === 'suspended') {
      try { audioCtx.resume(); } catch (e) {}
    }
  }

  function playTone(type, from, to, dur, vol) {
    if (!audioCtx) return;
    try {
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(from, t);
      osc.frequency.exponentialRampToValueAtTime(to, t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) {}
  }

  function randomKind() { return Math.random() < 0.5 ? 'mole' : 'leopard'; }

  function topSurface() {
    return stack.length ? stack[stack.length - 1].bottom - STEP_H : CREAM_TOP;
  }

  // 段が増えるほど雲が速く動く
  function swingSpeed() { return Math.min(1.5 + stack.length * 0.08, 3.4); }

  function spawnHanging() {
    hanging = { kind: nextKind || randomKind() };
    nextKind = randomKind();
    state.swingT = Math.random() * Math.PI * 2;
  }

  function hangX() { return W / 2 + Math.sin(state.swingT) * SWING_RANGE; }

  function drop() {
    if (!state.playing || !hanging || falling) return;
    falling = { kind: hanging.kind, x: hangX(), bottom: camY + HANG_Y + PIECE_H * 0.2, vy: 0 };
    hanging = null;
    playTone('sine', 500, 300, 0.12, 0.08);
  }

  function popup(text, x, y, color, big) {
    popups.push({ text: text, x: x, y: y, color: color, t: 0, big: !!big });
  }

  function land(p) {
    var support = stack.length ? stack[stack.length - 1] : { x: W / 2 };
    var dx = p.x - support.x;
    var y = topSurface();
    var angry = KINDS[p.kind].fussy && Math.abs(dx) > PIECE_W * 0.18;
    if (Math.abs(dx) <= PERFECT_PX) {
      p.x = support.x;
      state.combo += 1;
      state.score += 10 + 10 * state.combo;
      popup('ぴったり!' + (state.combo > 1 ? ' ×' + state.combo : ''), p.x, y - PIECE_H, colors.accent, true);
      popup('♥', p.x - 30, y - PIECE_H * 0.6, '#FF6FA8');
      popup('♥', p.x + 30, y - PIECE_H * 0.6, '#FF6FA8');
      playTone('sine', 880, 1320, 0.2, 0.12);
    } else {
      state.combo = 0;
      if (angry) {
        // 玖球は怒ってはね、ずれた方へさらに動く
        p.x += Math.sign(dx) * 10;
        popup('💢 ちゃんと置いて!', p.x, y - PIECE_H, '#E8483F');
        playTone('square', 260, 180, 0.15, 0.08);
      } else {
        popup(p.kind === 'leopard' ? '♥' : 'よし', p.x, y - PIECE_H * 0.8, p.kind === 'leopard' ? '#FF6FA8' : colors.ink);
        playTone('triangle', 420, 520, 0.08, 0.08);
      }
      state.score += 10;
    }
    stack.push({ kind: p.kind, x: p.x, bottom: y, bounce: angry ? 1 : 0.4 });

    if (!checkStability()) {
      updateHud();
      state.nextT = NEXT_DELAY;
    }
  }

  // 下の段から順に、上に乗っている全員の重心が足場からはみ出していないか調べる
  function checkStability() {
    for (var i = -1; i < stack.length - 1; i++) {
      var baseX = i < 0 ? W / 2 : stack[i].x;
      var half = i < 0 ? CREAM_HALF : PIECE_HALF;
      var sum = 0;
      for (var j = i + 1; j < stack.length; j++) sum += stack[j].x;
      var com = sum / (stack.length - i - 1);
      if (Math.abs(com - baseX) > half) {
        collapse(i + 1, Math.sign(com - baseX));
        return true;
      }
    }
    return false;
  }

  function collapse(from, dir) {
    var fallen = stack.splice(from);
    fallen.forEach(function (p, k) {
      debris.push({
        kind: p.kind, x: p.x, bottom: p.bottom,
        vx: dir * (90 + Math.random() * 80 + k * 20), vy: -120 - Math.random() * 120,
        rot: 0, vr: dir * (3 + Math.random() * 3)
      });
    });
    state.combo = 0;
    state.lives -= 1;
    popup(fallen.length > 1 ? 'ガラガラ〜!' : 'おっとっと!', W / 2, topSurface() - PIECE_H, '#E8483F', true);
    playTone('sawtooth', 300, 70, 0.6, 0.15);
    updateHud();
    if (state.lives <= 0) {
      state.nextT = 1.2;
    } else {
      state.nextT = NEXT_DELAY + 0.4;
    }
  }

  function updateHud() {
    scoreEl.textContent = state.score;
    heightEl.textContent = stack.length + '段';
    livesEl.textContent = state.lives > 0 ? new Array(state.lives + 1).join('♥') : '-';
    highScoreEl.textContent = state.highScore;
  }

  function startGame() {
    ensureAudio();
    state.score = 0;
    state.lives = LIVES;
    state.combo = 0;
    state.time = 0;
    stack = [];
    debris = [];
    popups = [];
    falling = null;
    nextKind = null;
    camY = 0;
    spawnHanging();
    updateHud();
    overlay.hidden = true;
    state.playing = true;
    lastTs = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function endGame() {
    state.playing = false;
    cancelAnimationFrame(rafId);
    render();
    var isRecord = state.score > state.highScore;
    if (isRecord) {
      state.highScore = state.score;
      saveHigh(state.highScore);
    }
    updateHud();
    overlayTitle.textContent = 'ゲームオーバー!';
    overlayMsg.innerHTML = stack.length + '段 / スコア: <span class="result-score">' + state.score + '</span>' +
      (isRecord ? '<br><span class="new-record">🎉 ハイスコア更新!</span>' : '<br>ハイスコア: ' + state.highScore);
    actionBtn.textContent = 'もう一度あそぶ';
    overlay.hidden = false;
  }

  function tick(ts) {
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    state.time += dt;

    if (hanging) state.swingT += swingSpeed() * dt;

    if (falling) {
      falling.vy += GRAVITY * dt;
      falling.bottom += falling.vy * dt;
      if (falling.bottom >= topSurface()) {
        var p = falling;
        falling = null;
        land(p);
      }
    } else if (!hanging) {
      state.nextT -= dt;
      if (state.nextT <= 0) {
        if (state.lives <= 0) { endGame(); return; }
        spawnHanging();
      }
    }

    stack.forEach(function (p) { p.bounce = Math.max(0, p.bounce - dt * 3); });
    debris.forEach(function (d) {
      d.vy += GRAVITY * dt;
      d.x += d.vx * dt;
      d.bottom += d.vy * dt;
      d.rot += d.vr * dt;
    });
    debris = debris.filter(function (d) { return d.bottom - camY < H + PIECE_H * 2; });
    popups.forEach(function (p) { p.t += dt; });
    popups = popups.filter(function (p) { return p.t < 1; });

    // いちばん上の段が画面の下寄りに来るようにカメラを上げる
    var target = Math.min(0, topSurface() - H * 0.62);
    camY += (target - camY) * Math.min(1, dt * 4);

    render();
    rafId = requestAnimationFrame(tick);
  }

  // ---- 描画 ----

  function drawSky() {
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, colors['sky-top']);
    sky.addColorStop(1, colors['sky-mid']);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    // 背景の雲はゆっくりスクロールさせて高さを感じさせる
    ctx.fillStyle = 'rgba(255, 255, 255, .55)';
    for (var k = 0; k < 6; k++) {
      var cy = ((k * 170 - camY * 0.4) % (H + 120) + H + 120) % (H + 120) - 60;
      drawCloud((k * 137) % (W - 80) + 40, cy, 0.8 + (k % 3) * 0.2);
    }
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x - 22 * s, y + 4 * s, 16 * s, 0, Math.PI * 2);
    ctx.arc(x, y - 6 * s, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 24 * s, y + 4 * s, 16 * s, 0, Math.PI * 2);
    ctx.rect(x - 22 * s, y + 4 * s, 46 * s, 16 * s);
    ctx.fill();
  }

  function drawCone() {
    var top = CONE_TOP - camY;
    if (top - 80 > H) return;
    // ワッフルコーン
    ctx.fillStyle = '#D9A15C';
    ctx.beginPath();
    ctx.moveTo(W / 2 - 66, top);
    ctx.lineTo(W / 2 + 66, top);
    ctx.lineTo(W / 2, top + 190);
    ctx.closePath();
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = '#B07A3A';
    ctx.lineWidth = 2;
    for (var k = -6; k <= 6; k++) {
      ctx.beginPath();
      ctx.moveTo(W / 2 + k * 22 - 100, top);
      ctx.lineTo(W / 2 + k * 22 + 100, top + 200);
      ctx.moveTo(W / 2 + k * 22 + 100, top);
      ctx.lineTo(W / 2 + k * 22 - 100, top + 200);
      ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#C98C48';
    ctx.fillRect(W / 2 - 70, top - 4, 140, 12);

    // フレアーなソフトクリームのうず巻き
    var layers = [[84, 0], [72, -24], [60, -46]];
    layers.forEach(function (l, i) {
      ctx.fillStyle = i % 2 === 0 ? '#FFF6EA' : '#FFEBD6';
      ctx.beginPath();
      ctx.ellipse(W / 2, top + l[1] - 6, l[0], 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200, 160, 120, .45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(W / 2, top + l[1] - 2, l[0] - 6, 14, 0, 0.2, Math.PI - 0.2);
      ctx.stroke();
    });
  }

  function drawPiece(kind, x, bottom, rot, squash) {
    var img = KINDS[kind].img;
    if (!img.complete || !img.naturalWidth) return;
    var w = PIECE_W * (1 + squash * 0.12), h = PIECE_H * (1 - squash * 0.12);
    ctx.save();
    ctx.translate(x, bottom - camY);
    if (rot) ctx.rotate(rot);
    ctx.drawImage(img, -w / 2, -h, w, h);
    ctx.restore();
  }

  function render() {
    if (!colors.ink) return;
    drawSky();
    drawCone();

    // 高く積むほどタワー全体が少しゆれる
    var sway = Math.sin(state.time * 2.4) * Math.min(stack.length * 0.35, 6);
    stack.forEach(function (p, i) {
      var lean = stack.length > 1 ? sway * i / (stack.length - 1) : 0;
      drawPiece(p.kind, p.x + lean, p.bottom, 0, Math.sin(p.bounce * Math.PI) * p.bounce);
    });
    if (falling) drawPiece(falling.kind, falling.x, falling.bottom, 0, 0);
    debris.forEach(function (d) { drawPiece(d.kind, d.x, d.bottom, d.rot, 0); });

    if (hanging) {
      var hx = hangX();
      drawPiece(hanging.kind, hx, camY + HANG_Y + PIECE_H * 0.2, 0, 0);
      ctx.fillStyle = '#FFFFFF';
      drawCloud(hx, HANG_Y + PIECE_H * 0.2 + 2, 1.2);
    }

    // つぎに落ちてくるお客様
    if (nextKind && state.playing) {
      ctx.fillStyle = 'rgba(255, 255, 255, .7)';
      ctx.beginPath();
      ctx.arc(36, 36, 26, 0, Math.PI * 2);
      ctx.fill();
      var img = KINDS[nextKind].img;
      if (img.complete && img.naturalWidth) ctx.drawImage(img, 14, 16, 44, 44 * 592 / 624);
      ctx.fillStyle = colors.ink;
      ctx.font = '800 12px "Nunito", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('つぎ', 36, 72);
    }

    popups.forEach(function (p) {
      ctx.globalAlpha = 1 - p.t;
      ctx.fillStyle = p.color;
      ctx.font = '800 ' + (p.big ? 24 : 16) + 'px "Baloo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, p.x, p.y - camY - p.t * 36);
      ctx.globalAlpha = 1;
    });
  }

  // ---- 入力 ----

  actionBtn.addEventListener('click', startGame);
  canvas.addEventListener('pointerdown', drop);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && state.playing) {
      e.preventDefault();
      drop();
    }
  });

  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      readColors();
      render();
    });
  } catch (e) {}

  function boot(data) {
    state.highScore = (data && typeof data.highScore === 'number') ? data.highScore : loadHigh();
    readColors();
    setupCanvas();
    updateHud();
    render();
  }

  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(function () { return { highScore: state.highScore }; });
    }
    if (window.claude && window.claude.hot && window.claude.hot.ready) {
      window.claude.hot.ready(boot);
    } else {
      boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
    }
  } catch (e) {
    boot(null);
  }
})();
</script>
</body>
</html>
